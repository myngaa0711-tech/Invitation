services:
  db:
    image: postgres:16-alpine
    container_name: invite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invite
      POSTGRES_PASSWORD: invite_dev_pw
      POSTGRES_DB: invite_db
    ports:
      - "5432:5432"
    volumes:
      - invite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invite -d invite_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invite_pgdata:
